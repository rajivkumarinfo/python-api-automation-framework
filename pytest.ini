[pytest]
minversion = 7.0
addopts =
    -ra
    --strict-markers
    --reruns 1
    --reruns-delay 2
    --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: fast critical-path checks
    crud: full booking lifecycle coverage
    contract: JSON schema / response contract validation
    regression: broader edge-case coverage
    flaky: candidate for automatic rerun in CI

log_cli = false
log_level = INFO
